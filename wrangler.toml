name = "prado-mx-web"
main = "src/worker.js"
compatibility_date = "2026-04-01"

# Sirve los archivos estáticos cuando no hay match en /api/*.
# `_headers` y `_redirects` son consumidos nativamente por Workers.
[assets]
directory = "./"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# D1 database para SMAE (herramienta interna de Hugo).
# Password de acceso se define con: wrangler secret put SMAE_PASSWORD
[[d1_databases]]
binding = "DB"
database_name = "prado-smae"
database_id = "52c4160e-5f31-446b-97a3-d6537078ca9d"
migrations_dir = "migrations"

# Dominios servidos por este worker (declarar TODOS o el deploy sobreescribe).
[[routes]]
pattern = "prado-mx.com"
custom_domain = true

[[routes]]
pattern = "www.prado-mx.com"
custom_domain = true

# Subdominio admin.prado-mx.com → mismo worker, sirve admin.html (CRM Hugo)
[[routes]]
pattern = "admin.prado-mx.com"
custom_domain = true

# Subdominio app.prado-mx.com → producto B2C self-service (suscripción)
[[routes]]
pattern = "app.prado-mx.com"
custom_domain = true
